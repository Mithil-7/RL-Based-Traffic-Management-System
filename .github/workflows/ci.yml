name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      TRAFFIC_QNET_BACKEND: numpy # CI runs the dependency-light backend; torch is exercised in the docker-build job's image build, not here
      TRAFFIC_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy==1.26.4 gymnasium==0.29.1 networkx==3.3 \
            pytest==8.3.3 pytest-asyncio==0.24.0 pytest-cov \
            pydantic==2.9.2 pydantic-settings==2.5.2 \
            fastapi==0.115.0 "uvicorn[standard]==0.30.6" websockets==13.1 httpx==0.27.2 \
            redis==5.0.8 fakeredis==2.24.1 sqlalchemy==2.0.35 \
            paho-mqtt==2.1.0 structlog==24.4.0 prometheus-client==0.20.0 \
            python-dotenv==1.0.1 tenacity==9.0.0 ruff==0.6.9 \
            opencv-python-headless==4.10.0.84 pillow==10.4.0 nicegui==2.7.0

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=traffic_system --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [api, brain, edge, dashboard, ingestion]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          use: true

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          tags: traffic-system-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
