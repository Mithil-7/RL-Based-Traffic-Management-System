# Mosquitto broker config for local/dev deployment.
#
# Production notes: this allows anonymous connections and plaintext on the
# default port, which is fine inside a private docker-compose network or a
# VPC, but NOT for a broker reachable from the public internet (real
# roadside edge devices). Before connecting real hardware over an untrusted
# network:
#   1. Set `allow_anonymous false` and configure a password file
#      (`mosquitto_passwd`) or, better, per-device X.509 client certificates.
#   2. Add a `listener 8883` block with `cafile`/`certfile`/`keyfile` for TLS.
#   3. Consider a managed broker (AWS IoT Core, HiveMQ Cloud) at real city
#      scale instead of self-hosting Mosquitto -- see ARCHITECTURE.md.

listener 1883
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
